name: Release (beta)

# Builds the production flavor, signed, for testers:
#   Android: release APK (sideload) + AAB (Play internal testing, if configured)
#   iOS:     TestFlight upload (internal testers, plus external groups if configured)
# Runs on a version tag (v0.1.0) or by hand from the Actions tab. Setup: docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [both, android, ios]
        default: both
      release_notes:
        description: What to test (shown to TestFlight testers)
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  version:
    name: Work out version
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.v.outputs.build_name }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # Version name comes from app/pubspec.yaml (e.g. 0.1.0+1 -> 0.1.0).
          build_name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$build_name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $build_name. Bump app/pubspec.yaml first."
            exit 1
          fi
          # Build number must only ever go up in both stores; "Re-run all jobs" gets a fresh one.
          build_number=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "### Version $build_name ($build_number)" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android (signed APK + AAB)
    needs: version
    if: github.event_name == 'push' || inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # attach the APK to the GitHub release on tags
    env:
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write production config
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG_PRODUCTION }}
        run: tool/release/write_config.sh "$APP_CONFIG" app/config/production.json
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/releasing.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build APK and AAB
        working-directory: app
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(--release --flavor production -t lib/main_production.dart
                --dart-define-from-file=config/production.json
                --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER")
          flutter build apk "${args[@]}"
          flutter build appbundle "${args[@]}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-production-release.apk \
             "../dist/body-comp-$BUILD_NAME-$BUILD_NUMBER.apk"
          cp build/app/outputs/bundle/productionRelease/app-production-release.aab \
             "../dist/body-comp-$BUILD_NAME-$BUILD_NUMBER.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: dist/
          retention-days: 30
      - name: Attach APK to a GitHub pre-release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*.apk
      - name: Upload to Play internal testing
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.abelshiferaw.bodycomp
          releaseFiles: dist/*.aab
          track: internal
          # "draft" until the app's first Play review, then "completed".
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  ios:
    name: iOS (TestFlight)
    needs: version
    if: github.event_name == 'push' || inputs.platforms != 'android'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUILD_NAME: ${{ needs.version.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: app/ios
      - name: Write production config
        env:
          APP_CONFIG: ${{ secrets.APP_CONFIG_PRODUCTION }}
        run: tool/release/write_config.sh "$APP_CONFIG" app/config/production.json
      - run: flutter pub get
      - name: Configure the Flutter build (Xcode signs and archives it next)
        working-directory: app
        run: |
          flutter build ios --release --no-codesign --config-only \
            --flavor production -t lib/main_production.dart \
            --dart-define-from-file=config/production.json \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
      - name: Decode distribution certificate
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        run: |
          if [[ -z "$CERT_BASE64" ]]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 is not set. See docs/releasing.md."
            exit 1
          fi
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
      - name: Sign and upload to TestFlight
        working-directory: app/ios
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          IOS_DIST_CERT_PATH: ${{ runner.temp }}/dist.p12
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: bundle exec fastlane beta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ env.BUILD_NAME }}-${{ env.BUILD_NUMBER }}
          path: |
            app/build/ios/ipa/*.ipa
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
          retention-days: 14
