name: app_ui
description: Design system shared by every module, theme tokens, light and dark themes, and common components.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0
  flutter: ^3.50.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

flutter:
  # Variable fonts from Google Fonts (SIL OFL, licenses next to them). Bundled
  # so text never waits on the network. Width and weight are set with
  # FontVariation in AppTheme.
  assets:
    - fonts/Archivo-OFL.txt
    - fonts/Inter-OFL.txt
  fonts:
    - family: Archivo
      fonts:
        - asset: fonts/Archivo.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter.ttf

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
