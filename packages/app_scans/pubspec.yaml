  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  http: ^1.5.0
  meta: ^1.17.0
  supabase: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
